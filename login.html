<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shiroca</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b14;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
background:#161625;
padding:40px;
border-radius:20px;
width:320px;
text-align:center;
}

h1{
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#7c3aed;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}
</style>
</head>

<body>

<div class="card">
<h1>Shiroca</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
