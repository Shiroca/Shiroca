<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiroca Chat</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b14;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:20px;
background:#161625;
text-align:center;
font-size:22px;
font-weight:bold;
}

.chat{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
max-width:70%;
padding:12px;
border-radius:15px;
margin-bottom:10px;
}

.ai{
background:#7c3aed;
}

.user{
background:#2b2b3d;
margin-left:auto;
}

.input-area{
display:flex;
padding:15px;
background:#161625;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
Shiroca AI
</div>

<div class="chat">

<div class="message ai">
Hello. I'm Shiroca. How are you today?
</div>

<div class="message user">
I'm doing well.
</div>

</div>

<div class="input-area">
<input placeholder="Type a message...">
<button>Send</button>
</div>

</body>
</html>
