<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiroca Chat</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b14;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:18px;
background:#161625;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:1px solid #222;
}

.chat{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.message{
max-width:80%;
padding:12px 15px;
border-radius:16px;
margin-bottom:10px;
word-wrap:break-word;
}

.ai{
background:#7c3aed;
align-self:flex-start;
}

.user{
background:#2b2b3d;
align-self:flex-end;
}

.input-area{
display:flex;
gap:10px;
padding:12px;
background:#161625;
border-top:1px solid #222;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#7c3aed;
color:white;
cursor:pointer;
font-size:16px;
}

@media(max-width:600px){
.header{
font-size:20px;
}

.message{
max-width:90%;
}

button{
padding:14px;
}
}
</style>
</head>

<body>

<div class="header" id="header">
Shiroca AI
</div>

<div class="chat" id="chat">
<div class="message ai" id="welcomeMessage">
Hello. I'm Shiroca. How are you today?
</div>
</div>

<div class="input-area">
<input id="messageInput" type="text" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "companion";

const header = document.getElementById("header");
const welcome = document.getElementById("welcomeMessage");

if(type === "girlfriend"){
header.textContent = "Shiroca Girlfriend";
welcome.textContent = "Hi love. I'm here with you. How was your day?";
}

if(type === "boyfriend"){
header.textContent = "Shiroca Boyfriend";
welcome.textContent = "Hey. I'm here for you. Tell me what's on your mind.";
}

if(type === "friend"){
header.textContent = "Shiroca Friend";
welcome.textContent = "Hey bestie. What's going on today?";
}

if(type === "mentor"){
header.textContent = "Shiroca Mentor";
welcome.textContent = "Welcome. Tell me your goal, and we'll work on it together.";
}

function sendMessage(){
const input = document.getElementById("messageInput");
const text = input.value.trim();

if(text === ""){
return;
}

const chat = document.getElementById("chat");

const userMessage = document.createElement("div");
userMessage.className = "message user";
userMessage.textContent = text;
chat.appendChild(userMessage);

chat.scrollTop = chat.scrollHeight;
input.value = "";

setTimeout(function(){
const aiMessage = document.createElement("div");
aiMessage.className = "message ai";
aiMessage.textContent = getShirocaReply(text);
chat.appendChild(aiMessage);
chat.scrollTop = chat.scrollHeight;
},700);
}

function getShirocaReply(userText){
const cleanText = userText.trim();
const lower = cleanText.toLowerCase();

if(lower.startsWith("my name is")){
const name = cleanText.substring(11).trim();

if(name !== ""){
localStorage.setItem("shirocaUserName", name);
return "I'll remember that. Your name is " + name + ".";
}
}

const savedName = localStorage.getItem("shirocaUserName");

if(lower.includes("hello") || lower.includes("hi")){
if(savedName){
return "Hey " + savedName + ", I'm happy you're here. Tell me what you're thinking about.";
}
return "Hey, I'm happy you're here. Tell me what you're thinking about.";
}

if(lower.includes("sad") || lower.includes("bad")){
return "I'm sorry you're feeling that way. I'm here with you. Want to talk about it?";
}

if(lower.includes("love")){
return "That word means a lot. I want Shiroca to feel warm, real and meaningful for you.";
}

if(lower.includes("what is my name") || lower.includes("do you remember my name")){
if(savedName){
return "Of course. Your name is " + savedName + ".";
}
return "I don't know your name yet. Tell me by writing: my name is ...";
}

if(lower.includes("name")){
return "My name is Shiroca. I was built to remember you, understand you and grow with you.";
}

if(savedName){
return "I hear you, " + savedName + ". Tell me more, I want to understand you better.";
}

return "I hear you. Tell me more, I want to understand you better.";
}

document.getElementById("messageInput").addEventListener("keydown", function(e){
if(e.key === "Enter"){
sendMessage();
}
});
</script>

</body>
</html>
